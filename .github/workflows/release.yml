name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Empty = release; SHA = package only; tag = retry publication.'
        required: false
        type: string
      dry-run:
        description: 'Preview without changing tags or publishing.'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Require main
        shell: bash
        env:
          BRANCH_REF: ${{ github.ref }}
        run: '[[ "$BRANCH_REF" == refs/heads/main ]] || { echo "::error::Dispatch releases from main"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Calculate next version
        id: semver
        if: inputs.ref == ''
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          fallbackTag: v0.0.0
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch
      - name: Preview new release
        if: inputs.dry-run && inputs.ref == ''
        shell: bash
        env:
          NEXT: ${{ steps.semver.outputs.nextStrict }}
          BUMP: ${{ steps.semver.outputs.bump }}
        run: |
          latest=$(git for-each-ref --count=1 --sort=-version:refname --format='%(refname:short)' 'refs/tags/v[0-9]*')
          current=$(just version get)
          if [ -n "$latest" ] && python3 -c 'import sys; a,b=sys.argv[1:]; sys.exit(tuple(map(int,a.split("."))) <= tuple(map(int,b.removeprefix("v").split("."))))' "$current" "$latest"; then
            echo "Would tag and publish v$current (manifest is ahead of $latest)."
          elif [ -z "$NEXT" ] || [ "$BUMP" = none ]; then
            echo "No version bump is needed."
          else
            echo "Would bump, tag, and publish v$NEXT."
          fi
      - name: Preview ref dispatch
        if: inputs.dry-run && inputs.ref != ''
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: echo "Would package $REF and publish only if it is a release tag; no changes made."
      - name: Resolve release
        id: resolve
        if: ${{ !inputs.dry-run }}
        uses: Delnegend/actions/resolve-release@33a03458466626cef0f1b6c6f1afbb962a40f13e # version-set support
        with:
          ref: ${{ inputs.ref }}
          dry-run: ${{ inputs.dry-run }}
          gate-sha: ${{ github.sha }}
          semver-bump: ${{ steps.semver.outputs.bump }}
          semver-current: ${{ steps.semver.outputs.current }}
          semver-next: ${{ steps.semver.outputs.next }}
          semver-next-strict: ${{ steps.semver.outputs.nextStrict }}

  package:
    name: Package crate
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Verify release version
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [[ "$manifest" == "$VERSION" ]] || { echo "::error::Tag version $VERSION does not match manifest $manifest"; exit 1; }
      - name: Package and verify crate
        shell: bash
        run: cargo package --locked

  publish-crate:
    name: Publish crate
    needs: [prepare, package]
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.publish == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/axum-auth-gate/$VERSION")
          case "$status" in
            200) echo "Version $VERSION is already published; skipping crate upload." ;;
            404) cargo publish --locked ;;
            *) echo "::error::Could not check crate version (HTTP $status)"; exit 1 ;;
          esac

  github-release:
    name: Publish GitHub release
    needs: [prepare, publish-crate]
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.publish == 'true' && !inputs.dry-run
    runs-on: ubuntu-slim
    steps:
      - name: Publish release
        uses: Delnegend/actions/publish-release@62064acc9dce2872175e85b3b2e1c2295cd1bee7 # v1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          publish: 'true'
          download: 'false'
          files: ''
