[package]
name = "axum-auth-gate"
version = "0.1.1"
edition = "2024"
description = "Basic and OIDC authentication middleware for Axum routers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Delnegend/axum-auth-gate"
keywords = ["axum", "authentication", "oidc", "middleware"]
categories = ["authentication", "web-programming::http-server"]

[features]
default = []
openapi = ["dep:utoipa"]

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
openidconnect = "4.0.1"
rand = "0.9.5"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync"] }
utoipa = { version = "5.5.0", optional = true }

[dev-dependencies]
ring = "0.17.14"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
